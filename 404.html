<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صفحه پیدا نشد | آرام محیط البرز — شرکت سمپاشی کرج</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/images/logo img/favicon.webp" />
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: vazirmatn, Tahoma, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        padding: 2rem;
        text-align: center;
      }
      .box {
        max-width: 60rem;
      }
      .code {
        font-size: clamp(5rem, 18vw, 10rem);
        font-weight: 800;
        line-height: 1;
        opacity: 0.9;
      }
      h1 {
        font-size: clamp(1.4rem, 5vw, 2.2rem);
        margin: 1.2rem 0 1rem;
        font-weight: 700;
      }
      p {
        font-size: 1.05rem;
        line-height: 2.1;
        opacity: 0.92;
        margin-bottom: 2.4rem;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: center;
      }
      .links a {
        text-decoration: none;
        padding: 0.9rem 1.8rem;
        border-radius: 0.8rem;
        font-weight: 700;
        font-size: 1rem;
        border: 2px solid rgba(255, 255, 255, 0.75);
        color: #fff;
        transition: background 0.2s ease, color 0.2s ease;
      }
      .links a.primary {
        background: #fff;
        color: #5a3fa8;
      }
      .links a:hover {
        background: rgba(255, 255, 255, 0.92);
        color: #5a3fa8;
      }
      .tel {
        margin-top: 2.4rem;
        font-size: 1rem;
        opacity: 0.9;
      }
      .tel a {
        color: #fff;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="code">۴۰۴</div>
      <h1>این صفحه پیدا نشد</h1>
      <p>
        صفحه‌ای که دنبال آن بودید حذف شده یا آدرس آن تغییر کرده است. می‌توانید از
        صفحه اصلی شروع کنید یا مقالات تخصصی سمپاشی را ببینید.
      </p>
      <div class="links">
        <a class="primary" href="/">صفحه اصلی</a>
        <a href="/#khadamat">خدمات سمپاشی</a>
        <a href="/blogs/">مقالات سمپاشی</a>
        <a href="/#faq">سوالات متداول</a>
      </div>
      <p class="tel">
        نیاز به مشاوره دارید؟ تماس بگیرید:
        <a href="tel:+989193613357">۰۹۱۹۳۶۱۳۳۵۷</a>
      </p>
    </div>
  </body>
</html>
